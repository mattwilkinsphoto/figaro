name: Stock sbt 2.0.11 Linux assessment

on:
  push:
    branches: [codex/stock-sbt-2-0-11-validation]
    paths:
      - .github/workflows/sbt-stock-linux.yml
      - tools/sbt-worker-repair/**
      - tools/test_stock_assessment.py
      - tools/test_stock_linux.py
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  assessment:
    if: github.ref == 'refs/heads/codex/stock-sbt-2-0-11-validation'
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, server, packaging]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check bounded validation tooling
        run: |
          python -B tools/test_stock_assessment.py
          python -B tools/test_stock_linux.py
          python -B tools/test_ci_repair.py
          python -B tools/docs/check_research_references.py
      - name: Execute frozen stock-toolchain protocol
        run: python -B tools/sbt-worker-repair/stock_linux.py --mode '${{ matrix.mode }}' --output "$RUNNER_TEMP/stock-${{ matrix.mode }}"
      - name: Preserve actual commands and complete outcomes, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbt-stock-${{ matrix.mode }}-evidence
          path: ${{ runner.temp }}/stock-${{ matrix.mode }}/evidence/
          if-no-files-found: error
          # Only the curated evidence tree; never homes, credentials or caches.
          include-hidden-files: true
