name: Java 17, Scala 3, and sbt 2 modernization

on:
  push:
    branches:
      - main
      - modernize/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_OPTS: -Xms1G -Xmx6G -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt runner
        uses: sbt/setup-sbt@v1

      - name: Compile all source sets
        run: sbt --server --batch -v "clean; compile; Test / compile"

      - name: Run documented quick start and common patterns
        run: >-
          sbt --server --batch
          "examples / Compile / runMain com.cra.figaro.example.documentation.QuickStart;
          examples / Compile / runMain com.cra.figaro.example.documentation.CommonPatterns"

      - name: Verify seeded parallel sampling and benchmark entry point
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly com.cra.figaro.test.modernization.ParallelPerformanceRegressionTest;
          examples / Compile / runMain com.cra.figaro.example.ParallelSamplingExample;
          examples / Compile / runMain com.cra.figaro.example.SamplingBenchmark coin 1000 1 1,2 seeded"

      - name: Verify multi-chain MH correctness, diagnostics, and example entry points
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly
          com.cra.figaro.test.modernization.MultiChainMcmcRegressionTest
          com.cra.figaro.test.modernization.McmcDiagnosticsRegressionTest;
          examples / Compile / runMain com.cra.figaro.example.MultiChainMcmcExample;
          examples / Compile / runMain com.cra.figaro.example.MultiChainMcmcBenchmark normal 200 1 1,2 2"

      - name: Verify documentation tooling, reference freshness, and local links
        # Includes the stopping-policy contracts in the generated reference.
        run: |
          sbt --server --batch "figaro / Compile / doc"
          python3 -B -m unittest discover -s tools/docs -p 'test_*.py'
          python3 -B -m unittest discover -s tools -p 'test_summarize*.py'
          python3 -B tools/summarize_calibration.py docs/proposal-calibration-results.csv --repetitions 30
          python3 -B tools/summarize_reliability.py docs/mcmc-reliability-results.csv --repetitions 60 --max-draws 48000
          python3 -B tools/summarize_sampling_research.py docs/sampling-research-results.csv --repetitions 30 --draws 12000
          python3 -B tools/summarize_sampling_budget.py docs/sampling-budget-results.csv --repetitions 30 --cap 100000
          python3 -B tools/summarize_high_dimensional.py docs/sampling-high-dimensional-results.csv --repetitions 20 --cap 300000
          python3 -B tools/summarize_vector_performance.py docs/vector-sampling-performance-results.csv --repetitions 5
          python3 -B tools/docs/build_reference.py --check
          python3 -B tools/docs/check_links.py

      - name: Verify continuous-vector sampler contracts and documented patterns
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.VectorSliceSamplerRegressionTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.VectorSliceSamplingExample"
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.MultiChainVectorSliceSamplerRegressionTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.MultiChainVectorSamplingExample"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.VectorSamplingPerformance 1 100 20" > "$RUNNER_TEMP/vector-performance-smoke.log"
          python3 -B tools/summarize_vector_performance.py "$RUNNER_TEMP/vector-performance-smoke.log" --repetitions 1 --draws 100 --warm-up 20

      - name: Run deterministic modernization regressions
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly
          com.cra.figaro.test.modernization.ProbabilityRegressionTest
          com.cra.figaro.test.modernization.Scala3RegressionTest
          com.cra.figaro.test.modernization.DeprecationRegressionTest
          com.cra.figaro.test.modernization.SpecialFunctionsRegressionTest
          com.cra.figaro.test.modernization.StoppingCriteriaRegressionTest
          com.cra.figaro.test.learning.SerializationTest"

      - name: Run stopping-criteria examples
        run: sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.StoppingCriteriaExample"

      - name: Verify reliability safeguards and matched-prefix audit entry point
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.McmcReliabilityRegressionTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.McmcReliabilityExample"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.McmcReliabilityValidation 1 12000 2" > "$RUNNER_TEMP/reliability-smoke.log"
          python3 -B tools/summarize_reliability.py "$RUNNER_TEMP/reliability-smoke.log" --repetitions 1 --max-draws 12000

      - name: Verify Gaussian block proposals
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.GaussianBlockProposalRegressionTest"
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.GaussianBlockCalibrationRegressionTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.ProposalCalibrationExample"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.ProposalCalibrationBenchmark 1 2000 2 6000"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.BlockedProposalExample"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.BlockedProposalBenchmark 2 4000 2"

      - name: Verify isolated sampling research kernels and complete smoke report
        run: |
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.SamplingResearchExample check"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.SamplingResearchExample 1 2000" > "$RUNNER_TEMP/sampling-research-smoke.log"
          python3 -B tools/summarize_sampling_research.py "$RUNNER_TEMP/sampling-research-smoke.log" --repetitions 1 --draws 2000

      - name: Verify affine polar kernels and matched-budget accounting
        # Budget validation is isolated from all production sampler APIs.
        # Its checked data include every predeclared seed, not only passing precision runs.
        run: |
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.SamplingBudgetValidation check"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.SamplingBudgetValidation 1 30000" > "$RUNNER_TEMP/sampling-budget-smoke.log"
          python3 -B tools/summarize_sampling_budget.py "$RUNNER_TEMP/sampling-budget-smoke.log" --repetitions 1 --cap 30000

      - name: Verify higher-dimensional kernels and complete budget reports
        # Analytic invariance controls are not empirical coverage gates.
        run: |
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.HighDimensionalSamplingValidation check"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.HighDimensionalSamplingValidation 1 20000" > "$RUNNER_TEMP/high-dimensional-smoke.log"
          python3 -B tools/summarize_high_dimensional.py "$RUNNER_TEMP/high-dimensional-smoke.log" --repetitions 1 --cap 20000

      - name: Exercise representative stopping models and trapped-chain control
        # Smoke/lifecycle check only; full repeated-seed evidence is documented separately.
        run: sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.StoppingCriteriaValidation 2 4000 2"

      - name: Run deterministic legacy density regressions
        run: >-
          sbt --server --batch
          'figaro / Test / testOnly
          com.cra.figaro.test.library.atomic.discrete.DiscreteTest
          com.cra.figaro.test.library.atomic.continuous.ContinuousTest
          -- -z "have the correct density"'

      - name: Run anytime lifecycle regressions
        run: >-
          sbt --server --batch
          'figaro / Test / testOnly
          com.cra.figaro.test.algorithm.AlgorithmTest
          -- -z "An anytime algorithm"'

      - name: Run collection and factor regressions
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly
          com.cra.figaro.test.util.MultiSetTest
          com.cra.figaro.test.util.PriorityMapTest
          com.cra.figaro.test.util.SelectableSetTest
          com.cra.figaro.test.util.CacheTest
          com.cra.figaro.test.util.ResamplerTest
          com.cra.figaro.test.algorithm.factored.FactorTest
          -- -l com.cra.figaro.test.Performance"

      - name: Observe legacy collection timing checks (advisory)
        continue-on-error: true
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly
          com.cra.figaro.test.util.PriorityMapTest
          com.cra.figaro.test.util.SelectableSetTest
          -- -n com.cra.figaro.test.Performance"

      - name: Run deterministic parallel-structure regressions
        run: |
          sbt --server --batch 'figaro / Test / testOnly com.cra.figaro.test.algorithm.filtering.ParParticleFilterTest -- -z "splitting up the particle indices over threads"'
          sbt --server --batch 'figaro / Test / testOnly com.cra.figaro.test.algorithm.sampling.ParImportanceTest -- -z "not suffer from stack overflow with small probability of success"'

      - name: Verify coverage plugin and restore non-instrumented build
        # Keep tests last in their invocation so later sbt commands cannot mask a failure.
        run: |
          sbt --server --batch "set Global / cacheStores := Seq.empty; clean; coverage; figaro / Test / testOnly com.cra.figaro.test.modernization.ProbabilityRegressionTest com.cra.figaro.test.modernization.MultiChainMcmcRegressionTest com.cra.figaro.test.modernization.McmcDiagnosticsRegressionTest com.cra.figaro.test.modernization.GaussianBlockProposalRegressionTest com.cra.figaro.test.modernization.GaussianBlockCalibrationRegressionTest com.cra.figaro.test.modernization.McmcReliabilityRegressionTest com.cra.figaro.test.modernization.VectorSliceSamplerRegressionTest com.cra.figaro.test.modernization.MultiChainVectorSliceSamplerRegressionTest"
          sbt --server --batch "coverage; figaro / coverageReport"
          sbt --server --batch "coverageOff; clean"

      - name: Build first reproducibility candidate
        run: >-
          sbt --server --batch
          "figaro / Compile / packageBin; figaro / assembly"

      - name: Record artifact checksums
        run: |
          sha256sum \
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.0.0-modern.10-SNAPSHOT.jar \
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.0.0-modern.10-SNAPSHOT-fat.jar \
            > "$RUNNER_TEMP/figaro-artifacts.sha256"

      - name: Verify clean rebuild is byte-for-byte reproducible
        run: |
          # Bypass sbt 2's artifact cache: restoring the first JAR is not a rebuild.
          sbt --server --batch "set Global / cacheStores := Seq.empty; clean; figaro / Compile / packageBin; figaro / assembly"
          sha256sum --check "$RUNNER_TEMP/figaro-artifacts.sha256"

      - name: Build classifiers and verify local Maven publication
        run: >-
          sbt --server --batch
          "figaro / Compile / packageSrc; figaro / Compile / packageDoc; figaro / publishLocal"

      - name: Generate CycloneDX SBOM from the assembled runtime
        uses: anchore/sbom-action@v0.24.0
        with:
          file: target/out/jvm/scala-3.9.0/figaro/figaro_3-6.0.0-modern.10-SNAPSHOT-fat.jar
          format: cyclonedx-json
          output-file: Figaro.cdx.json
          artifact-name: figaro-cyclonedx-sbom
          upload-release-assets: false

      - name: Upload JVM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: figaro-java17-scala3-sbt2
          path: |
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.0.0-modern.10-SNAPSHOT.jar
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.0.0-modern.10-SNAPSHOT-fat.jar
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.0.0-modern.10-SNAPSHOT-sources.jar
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.0.0-modern.10-SNAPSHOT-javadoc.jar
          if-no-files-found: error
