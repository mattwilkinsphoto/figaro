name: Java 17, Scala 3, and sbt 2 modernization

on:
  push:
    branches:
      - main
      - modernize/**
      - release/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gvm-bhattacharyya-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install isolated research-only arithmetic dependency
        run: python3 -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Verify Bhattacharyya derivation and independent controls
        run: python3 -B -m unittest discover -s tools -p 'test_gvm_bhattacharyya_research.py' -v
      - name: Verify mutual-information oracles and independent positive marginal
        run: python3 -B -m unittest discover -s tools -p 'test_gvm_mutual_information.py' -v
      - name: Verify common-family and divergence reference oracles
        run: python3 -B -m unittest discover -s tools -p 'test_common_*reference.py' -v
      - name: Verify multivariate t independent references
        run: python3 -B -m unittest discover -s tools -p 'test_multivariate_t_reference.py' -v
      - name: Verify bounded IID arithmetic and probability references
        run: python3 -B -m unittest discover -s tools -p 'test_bounded_iid_reference.py' -v
      - name: Verify adaptive bounded precision references
        run: python3 -B -m unittest discover -s tools -p 'test_empirical_bernstein_reference.py' -v
      - name: Verify independent selected D5 distribution references
        run: python3 -B -m unittest discover -s tools -p 'test_breadth_reference.py' -v
      - name: Check legacy information and inverse-gamma references
        run: python3 -B -m unittest discover -s tools -p 'test_legacy_information_reference.py' -v
      - name: Check covariance-prior numerical references
        run: python3 -B -m unittest discover -s tools -p 'test_covariance_reference.py' -v
      - name: Check rare-event numerical references and complete cost evidence
        run: |
          python3 -B tools/test_rare_event_reference.py
          python3 -B tools/test_rare_event_evidence.py
          python3 -B tools/test_extended_construction_reference.py
          python3 -B tools/test_capability_expansion_evidence.py
          python3 -B tools/test_modeling_reference.py
          python3 -B tools/test_modeling_evidence.py
          python3 -B tools/test_release61_reference.py
          python3 -B tools/test_release61_evidence.py
          python3 -B tools/test_build_release_bundle.py
      - name: Verify independent statistical-validation posterior references
        run: |
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          python3 -B -m unittest discover -s tools -p 'test_statistical_validation_reference.py' -v
          python3 -B -m unittest discover -s tools -p 'test_inference_health_reference.py' -v
          python3 -B -m unittest discover -s tools -p 'test_mixture_fit_reference.py' -v
      - name: Verify complete matched-accuracy timing evidence
        run: |
          python3 -B -m unittest discover -s tools -p 'test_gvm_bhattacharyya_performance.py' -v
          python3 -B tools/summarize_gvm_bhattacharyya_performance.py docs/GVM_BHATTACHARYYA_PERFORMANCE_RUNS.txt
      - name: Verify concentration and cancellation reliability oracles
        run: python3 -B -m unittest discover -s tools -p 'test_gvm_bhattacharyya_reliability.py' -v
      - name: Verify research-only positive scalar integration
        run: python3 -B -m unittest discover -s tools -p 'test_gvm_bhattacharyya_positive.py' -v
      - name: Verify scalar matched-accuracy evidence and physical-input oracles
        run: |
          python3 -B -m unittest discover -s tools -p 'test_gvm_scalar_*.py' -v
          python3 -B tools/summarize_gvm_scalar_performance.py docs/GVM_SCALAR_PERFORMANCE_RUNS.txt
          python3 -B tools/summarize_gvm_scalar_audit.py docs/GVM_SCALAR_AUDIT_RUNS.txt

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_OPTS: -Xms1G -Xmx6G -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt runner
        uses: sbt/setup-sbt@v1

      - name: Compile all source sets
        run: sbt --server --batch -v "clean; compile; Test / compile"

      - name: Run documented quick start and common patterns
        run: >-
          sbt --server --batch
          "examples / Compile / runMain com.cra.figaro.example.documentation.QuickStart;
          examples / Compile / runMain com.cra.figaro.example.documentation.CommonPatterns;
          examples / Compile / runMain com.cra.figaro.example.documentation.ClassicTutorials;
          examples / Compile / runMain com.cra.figaro.example.documentation.VonMisesExample"

      - name: Verify circular von Mises foundation and log-density likelihoods
        run: sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.VonMisesRegressionTest"

      - name: Verify 6.1 conditional models and fitted mixture contracts
        run: sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.Release61ModelingTest"

      - name: Verify inference health on fixed concentrated-posterior workloads
        run: sbt --server --batch "figaro / Test / runMain com.cra.figaro.test.modernization.InferenceHealthStudy"

      - name: Verify research-only defensive proposal contracts and smoke entry point
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly com.cra.figaro.test.modernization.DefensiveImportanceTest;
          figaro / Test / runMain com.cra.figaro.test.modernization.DefensiveImportanceStudy smoke"

      - name: Verify joint Gauss-von Mises contracts and examples
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly com.cra.figaro.test.modernization.GaussVonMisesRegressionTest com.cra.figaro.test.modernization.GaussVonMisesDiagnosticsTest com.cra.figaro.test.modernization.GaussVonMisesMomentsTest com.cra.figaro.test.modernization.GaussVonMisesScoreTest com.cra.figaro.test.modernization.GaussVonMisesGradientTest com.cra.figaro.test.modernization.GaussVonMisesQuadratureTest com.cra.figaro.test.modernization.GaussVonMisesTensorQuadratureTest com.cra.figaro.test.modernization.GaussVonMisesQuadratureComparisonTest com.cra.figaro.test.modernization.GaussVonMisesBhattacharyyaTest com.cra.figaro.test.modernization.GaussVonMisesBhattacharyyaReliabilityTest;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesExample;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesMomentsExample;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesScoreExample;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesGradientExample;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesQuadratureExample;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesTensorQuadratureExample;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesQuadratureComparisonExample;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesBhattacharyyaExample;
          examples / Compile / runMain com.cra.figaro.example.GaussVonMisesBhattacharyyaPerformance check"

      - name: Verify GVM mutual information
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly com.cra.figaro.test.modernization.GaussVonMisesMutualInformationTest;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesMutualInformationExample"

      - name: Verify distribution constructions, Gaussian mixtures and Gaussian information
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.DistributionConstructionsTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.documentation.DistributionConstructionsExample"

      - name: Verify common families and information measures
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly com.cra.figaro.test.modernization.CommonDistributionsTest com.cra.figaro.test.modernization.CommonInformationMetricsTest;
          examples / Compile / runMain com.cra.figaro.example.documentation.CommonDistributionsExample"

      - name: Verify opt-in positive scalar GVM comparison
        # Independent public entry point; the Fourier API never selects it automatically.
        # Its focused suite also runs under the full modernization wildcard below.
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly com.cra.figaro.test.modernization.GaussVonMisesScalarBhattacharyyaTest;
          figaro / Test / testOnly com.cra.figaro.test.modernization.GvmScalarAuditTest com.cra.figaro.test.modernization.GvmScalarCellBoundTest com.cra.figaro.test.modernization.GvmScalarTailPolicyTest;
          examples / Compile / runMain com.cra.figaro.example.documentation.GaussVonMisesScalarBhattacharyyaExample;
          examples / Compile / runMain com.cra.figaro.example.GaussVonMisesScalarPerformance check"

      - name: Verify seeded parallel sampling and benchmark entry point
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly com.cra.figaro.test.modernization.ParallelPerformanceRegressionTest;
          examples / Compile / runMain com.cra.figaro.example.ParallelSamplingExample;
          examples / Compile / runMain com.cra.figaro.example.SamplingBenchmark coin 1000 1 1,2 seeded"

      - name: Verify multi-chain MH correctness, diagnostics, and example entry points
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly
          com.cra.figaro.test.modernization.MultiChainMcmcRegressionTest
          com.cra.figaro.test.modernization.McmcDiagnosticsRegressionTest;
          examples / Compile / runMain com.cra.figaro.example.MultiChainMcmcExample;
          examples / Compile / runMain com.cra.figaro.example.MultiChainMcmcBenchmark normal 200 1 1,2 2"

      - name: Verify documentation tooling, reference freshness, and local links
        # Includes the stopping-policy contracts in the generated reference.
        run: |
          sbt --server --batch "figaro / Compile / doc"
          python3 -B -m unittest discover -s tools/docs -p 'test_*.py'
          python3 -B -m unittest discover -s tools -p 'test_summarize*.py'
          python3 -B tools/summarize_defensive_importance.py docs/defensive-importance-results.csv
          python3 -B tools/summarize_defensive_importance.py docs/defensive-importance-coverage.csv --coverage
          python3 -B tools/summarize_vector_importance.py docs/vector-importance-results.csv
          python3 -B tools/summarize_importance_calibration.py docs/importance-calibration-results.csv
          python3 -B tools/summarize_mixture_proposals.py docs/mixture-proposal-results.csv
          python3 -B tools/summarize_graph_proposals.py docs/graph-proposal-results.csv
          python3 -B tools/summarize_graph_cost.py docs/graph-cost-results.csv
          python3 -B tools/summarize_graph_cost.py docs/graph-matched-cost-results.csv --matched
          python3 -B tools/summarize_joint_proposals.py docs/joint-proposal-results.csv
          python3 -B -m unittest discover -s tools -p 'test_check_acceptance_artifacts.py'
          python3 -B tools/summarize_interleaved_performance.py check docs/core-performance-acceptance-results.csv --baseline-csv docs/parallel-vector-diagnostics-results.csv
          python3 -B tools/summarize_calibration.py docs/proposal-calibration-results.csv --repetitions 30
          python3 -B tools/summarize_reliability.py docs/mcmc-reliability-results.csv --repetitions 60 --max-draws 48000
          python3 -B tools/summarize_sampling_research.py docs/sampling-research-results.csv --repetitions 30 --draws 12000
          python3 -B tools/summarize_sampling_budget.py docs/sampling-budget-results.csv --repetitions 30 --cap 100000
          python3 -B tools/summarize_high_dimensional.py docs/sampling-high-dimensional-results.csv --repetitions 20 --cap 300000
          python3 -B tools/summarize_vector_performance.py docs/vector-sampling-performance-results.csv --repetitions 5
          python3 -B tools/summarize_vector_performance.py docs/parallel-vector-diagnostics-results.csv --repetitions 5 --baseline docs/vector-sampling-performance-results.csv
          python3 -B tools/summarize_vector_profile.py docs/vector-allocation-profile-results.csv
          python3 -B tools/summarize_vector_performance.py docs/vector-profile-benchmark-results.csv --repetitions 5 --baseline docs/parallel-vector-diagnostics-results.csv
          python3 -B tools/summarize_vector_performance.py docs/primitive-reduction-performance-results.csv --repetitions 5 --baseline docs/parallel-vector-diagnostics-results.csv
          python3 -B tools/summarize_vector_profile.py docs/primitive-reduction-profile-results.csv
          python3 -B tools/summarize_vector_performance.py docs/primitive-reduction-profile-benchmark-results.csv --repetitions 5 --baseline docs/primitive-reduction-performance-results.csv
          python3 -B tools/summarize_vector_performance.py docs/primitive-fft-performance-results.csv --repetitions 5 --baseline docs/primitive-reduction-performance-results.csv
          python3 -B tools/summarize_vector_profile.py docs/primitive-fft-profile-results.csv
          python3 -B tools/summarize_vector_performance.py docs/primitive-fft-profile-benchmark-results.csv --repetitions 5 --baseline docs/primitive-fft-performance-results.csv
          python3 -B tools/summarize_vector_performance.py docs/primitive-sorting-performance-results.csv --repetitions 5 --baseline docs/primitive-fft-performance-results.csv
          python3 -B tools/summarize_vector_profile.py docs/primitive-sorting-profile-results.csv
          python3 -B tools/summarize_vector_performance.py docs/primitive-sorting-profile-benchmark-results.csv --repetitions 5 --baseline docs/primitive-sorting-performance-results.csv
          java -XX:-UsePerfData tools/VectorProfileAttribution.java --self-test
          python3 -B tools/summarize_interleaved_performance.py check docs/interleaved-performance-results.csv --baseline-csv docs/primitive-fft-performance-results.csv
          python3 -B tools/summarize_vector_attribution.py --csv docs/vector-attribution-results.csv --profile docs/primitive-sorting-profile-results.csv
          python3 -B tools/summarize_diagnostic_hotspots.py --csv docs/diagnostic-hotspot-results.csv
          python3 -B tools/summarize_resource_scaling.py check docs/resource-scaling-results.csv
          python3 -B tools/summarize_interleaved_performance.py check docs/diagnostic-radix-performance-results.csv --baseline-csv docs/primitive-sorting-performance-results.csv
          python3 -B tools/docs/build_reference.py --check
          python3 -B tools/docs/check_links.py

      - name: Reject mislabeled historical hotspot timings on the hybrid library
        run: |
          if sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.DiagnosticHotspotStudy 1 64000" > "$RUNNER_TEMP/diagnostic-hotspot-guard.log" 2>&1; then
            echo "Historical hotspot timings unexpectedly accepted the hybrid library"
            exit 1
          fi
          python3 -c 'import os; from pathlib import Path; text = (Path(os.environ["RUNNER_TEMP"]) / "diagnostic-hotspot-guard.log").read_text(); assert "Full hotspot timings require the pre-integration eda9ebba library runtime" in text'

      - name: Verify opt-in frozen vector proposals
        # Accuracy outcomes are recorded, not hidden by retries or warning-based exclusions.
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.VectorImportanceTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.documentation.VectorImportanceExample"
          sbt --server --batch "figaro / Test / runMain com.cra.figaro.test.modernization.VectorImportanceAcceptance full" > "$RUNNER_TEMP/vector-importance.log"
          python3 -B tools/summarize_vector_importance.py "$RUNNER_TEMP/vector-importance.log"

      - name: Verify pilot-only multi-component proposals
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.GaussianMixtureProposalTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.documentation.MixtureProposalExample"

      - name: Verify owned graph proposal integration
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.ConditionalProposalTest com.cra.figaro.test.modernization.MultivariateStudentTTest com.cra.figaro.test.modernization.MonteCarloInformationTest com.cra.figaro.test.modernization.BoundedIidPrecisionTest com.cra.figaro.test.modernization.EmpiricalBernsteinPrecisionTest"
          python3 -B -m unittest discover -s tools -p 'test_summarize_bounded_precision.py'
          python3 -B tools/summarize_bounded_precision.py docs/ADAPTIVE_PRECISION_RUNS.csv
          sbt --server --batch "figaro / Test / runMain com.cra.figaro.test.modernization.JointProposalStudy smoke"
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.GraphProposalImportanceTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.documentation.GraphProposalExample"
          sbt --server --batch "figaro / Test / runMain com.cra.figaro.test.modernization.GraphProposalStudy full" > "$RUNNER_TEMP/graph-proposals.log"
          python3 -B tools/summarize_graph_proposals.py "$RUNNER_TEMP/graph-proposals.log"

      - name: Verify restricted static executor and complete cost evidence
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.StaticGraphImportanceTest"
          python3 -B tools/summarize_static_graph.py docs/STATIC_GRAPH_RUNS.csv

      - name: Verify selected distribution breadth and documented examples
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.WeightedRareEventTest com.cra.figaro.test.modernization.StaticProposalTest com.cra.figaro.test.modernization.ExtendedConstructionsTest"
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.ObservationModelTest com.cra.figaro.test.modernization.GvmMixtureCopulaTest"
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.DistributionBreadthTest com.cra.figaro.test.modernization.LegacyDistributionContractsTest com.cra.figaro.test.modernization.CovariancePriorsTest com.cra.figaro.test.modernization.RareEventImportanceTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.documentation.DistributionBreadthExample"

      - name: Verify continuous-vector sampler contracts and documented patterns
        run: |
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.ResourceScalingStudy check"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.DiagnosticHotspotStudy check"
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.VectorSliceSamplerRegressionTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.VectorSliceSamplingExample"
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.MultiChainVectorSliceSamplerRegressionTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.MultiChainVectorSamplingExample"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.VectorSamplingPerformance 1 100 20" > "$RUNNER_TEMP/vector-performance-smoke.log"
          python3 -B tools/summarize_vector_performance.py "$RUNNER_TEMP/vector-performance-smoke.log" --repetitions 1 --draws 100 --warm-up 20
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.VectorSamplingProfile $RUNNER_TEMP/vector-profile.jfr 1 100 20" > "$RUNNER_TEMP/vector-profile-smoke.log"
          python3 -B tools/summarize_vector_performance.py "$RUNNER_TEMP/vector-profile-smoke.log" --repetitions 1 --draws 100 --warm-up 20
          python3 -B tools/summarize_vector_profile.py "$RUNNER_TEMP/vector-profile-smoke.log"

      - name: Run deterministic modernization regressions
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly
          com.cra.figaro.test.modernization.ProbabilityRegressionTest
          com.cra.figaro.test.modernization.Scala3RegressionTest
          com.cra.figaro.test.modernization.DeprecationRegressionTest
          com.cra.figaro.test.modernization.SpecialFunctionsRegressionTest
          com.cra.figaro.test.modernization.StatisticalValidationTest
          com.cra.figaro.test.modernization.SamplingRandomTest
          com.cra.figaro.test.modernization.RandomStreamsTest
          com.cra.figaro.test.modernization.RandomSelectionTest
          com.cra.figaro.test.modernization.InferenceHealthTest
          com.cra.figaro.test.modernization.ImportanceCalibrationTest
          com.cra.figaro.test.modernization.StoppingCriteriaRegressionTest
          com.cra.figaro.test.learning.SerializationTest"

      - name: Run stopping-criteria examples
        run: sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.StoppingCriteriaExample"

      - name: Verify reliability safeguards and matched-prefix audit entry point
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.McmcReliabilityRegressionTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.McmcReliabilityExample"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.McmcReliabilityValidation 1 12000 2" > "$RUNNER_TEMP/reliability-smoke.log"
          python3 -B tools/summarize_reliability.py "$RUNNER_TEMP/reliability-smoke.log" --repetitions 1 --max-draws 12000

      - name: Verify Gaussian block proposals
        run: |
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.GaussianBlockProposalRegressionTest"
          sbt --server --batch "figaro / Test / testOnly com.cra.figaro.test.modernization.GaussianBlockCalibrationRegressionTest"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.ProposalCalibrationExample"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.ProposalCalibrationBenchmark 1 2000 2 6000"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.BlockedProposalExample"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.BlockedProposalBenchmark 2 4000 2"

      - name: Verify isolated sampling research kernels and complete smoke report
        run: |
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.SamplingResearchExample check"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.SamplingResearchExample 1 2000" > "$RUNNER_TEMP/sampling-research-smoke.log"
          python3 -B tools/summarize_sampling_research.py "$RUNNER_TEMP/sampling-research-smoke.log" --repetitions 1 --draws 2000

      - name: Verify affine polar kernels and matched-budget accounting
        # Budget validation is isolated from all production sampler APIs.
        # Its checked data include every predeclared seed, not only passing precision runs.
        run: |
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.SamplingBudgetValidation check"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.SamplingBudgetValidation 1 30000" > "$RUNNER_TEMP/sampling-budget-smoke.log"
          python3 -B tools/summarize_sampling_budget.py "$RUNNER_TEMP/sampling-budget-smoke.log" --repetitions 1 --cap 30000

      - name: Verify higher-dimensional kernels and complete budget reports
        # Analytic invariance controls are not empirical coverage gates.
        run: |
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.HighDimensionalSamplingValidation check"
          sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.HighDimensionalSamplingValidation 1 20000" > "$RUNNER_TEMP/high-dimensional-smoke.log"
          python3 -B tools/summarize_high_dimensional.py "$RUNNER_TEMP/high-dimensional-smoke.log" --repetitions 1 --cap 20000

      - name: Exercise representative stopping models and trapped-chain control
        # Smoke/lifecycle check only; full repeated-seed evidence is documented separately.
        run: sbt --server --batch "examples / Compile / runMain com.cra.figaro.example.StoppingCriteriaValidation 2 4000 2"

      - name: Run deterministic legacy density regressions
        run: >-
          sbt --server --batch
          'figaro / Test / testOnly
          com.cra.figaro.test.library.atomic.discrete.DiscreteTest
          com.cra.figaro.test.library.atomic.continuous.ContinuousTest
          -- -z "have the correct density"'

      - name: Run anytime lifecycle regressions
        run: >-
          sbt --server --batch
          'figaro / Test / testOnly
          com.cra.figaro.test.algorithm.AlgorithmTest
          -- -z "An anytime algorithm"'

      - name: Run collection and factor regressions
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly
          com.cra.figaro.test.util.MultiSetTest
          com.cra.figaro.test.util.PriorityMapTest
          com.cra.figaro.test.util.SelectableSetTest
          com.cra.figaro.test.util.CacheTest
          com.cra.figaro.test.util.ResamplerTest
          com.cra.figaro.test.algorithm.factored.FactorTest
          -- -l com.cra.figaro.test.Performance"

      - name: Observe legacy collection timing checks (advisory)
        continue-on-error: true
        run: >-
          sbt --server --batch
          "figaro / Test / testOnly
          com.cra.figaro.test.util.PriorityMapTest
          com.cra.figaro.test.util.SelectableSetTest
          -- -n com.cra.figaro.test.Performance"

      - name: Run deterministic parallel-structure regressions
        run: |
          sbt --server --batch 'figaro / Test / testOnly com.cra.figaro.test.algorithm.filtering.ParParticleFilterTest -- -z "splitting up the particle indices over threads"'
          sbt --server --batch 'figaro / Test / testOnly com.cra.figaro.test.algorithm.sampling.ParImportanceTest -- -z "not suffer from stack overflow with small probability of success"'

      - name: Verify coverage plugin and restore non-instrumented build
        # Keep tests last in their invocation so later sbt commands cannot mask a failure.
        run: |
          test ! -e "$RUNNER_TEMP/figaro-coverage-cold"
          sbt --server --batch -Dsbt.global.localcache="$RUNNER_TEMP/figaro-coverage-cold" "clean; coverage; figaro / Test / testOnly com.cra.figaro.test.modernization.ProbabilityRegressionTest com.cra.figaro.test.modernization.MultiChainMcmcRegressionTest com.cra.figaro.test.modernization.McmcDiagnosticsRegressionTest com.cra.figaro.test.modernization.GaussianBlockProposalRegressionTest com.cra.figaro.test.modernization.GaussianBlockCalibrationRegressionTest com.cra.figaro.test.modernization.McmcReliabilityRegressionTest com.cra.figaro.test.modernization.VectorSliceSamplerRegressionTest com.cra.figaro.test.modernization.MultiChainVectorSliceSamplerRegressionTest"
          sbt --server --batch -Dsbt.global.localcache="$RUNNER_TEMP/figaro-coverage-cold" "coverage; figaro / coverageReport"
          sbt --server --batch "coverageOff; clean"

      - name: Build first reproducibility candidate
        run: |
          set -o pipefail
          test ! -e "$RUNNER_TEMP/figaro-repro-a"
          sbt --server --batch -Dsbt.global.localcache="$RUNNER_TEMP/figaro-repro-a" "clean; figaro / Compile / packageBin; figaro / assembly" | tee "$RUNNER_TEMP/figaro-repro-a.log"
          grep -E 'compiling [1-9][0-9]* Scala sources to .*figaro/classes' "$RUNNER_TEMP/figaro-repro-a.log"

      - name: Record artifact checksums
        run: |
          sha256sum \
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0.jar \
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0-fat.jar \
            > "$RUNNER_TEMP/figaro-artifacts.sha256"

      - name: Verify clean rebuild is byte-for-byte reproducible
        run: |
          # Independent empty action caches plus clean outputs force both compilations.
          set -o pipefail
          test ! -e "$RUNNER_TEMP/figaro-repro-b"
          sbt --server --batch -Dsbt.global.localcache="$RUNNER_TEMP/figaro-repro-b" "clean; figaro / Compile / packageBin; figaro / assembly" | tee "$RUNNER_TEMP/figaro-repro-b.log"
          grep -E 'compiling [1-9][0-9]* Scala sources to .*figaro/classes' "$RUNNER_TEMP/figaro-repro-b.log"
          sha256sum --check "$RUNNER_TEMP/figaro-artifacts.sha256"

      - name: Build classifiers and verify local Maven publication
        run: >-
          sbt --server --batch -Dsbt.global.localcache="$RUNNER_TEMP/figaro-repro-b"
          "figaro / Compile / packageSrc; figaro / Compile / packageDoc; figaro / publishLocal"

      - name: Verify artifact contents and legal notices
        run: python3 -B tools/check_acceptance_artifacts.py target/out/jvm/scala-3.9.0/figaro

      - name: Verify independently published consumer
        working-directory: tools/acceptance-consumer
        run: |
          export FIGARO_EXPECTED_SHA256="$(sha256sum ../../target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0.jar | cut -d' ' -f1)"
          sbt --server --batch "runMain FigaroConsumerCheck"

      - name: Build Maven-layout release bundle
        run: python3 -B tools/build_release_bundle.py target/out/jvm/scala-3.9.0/figaro target/release61-bundle

      - name: Verify release-bundle consumer without Ivy local
        working-directory: tools/acceptance-consumer
        run: |
          export FIGARO_RELEASE_MAVEN_ROOT="$GITHUB_WORKSPACE/target/release61-bundle/maven"
          export FIGARO_EXPECTED_SHA256="$(sha256sum ../../target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0.jar | cut -d' ' -f1)"
          sbt --server --batch "clean; runMain FigaroConsumerCheck"

      - name: Generate CycloneDX SBOM from the assembled runtime
        uses: anchore/sbom-action@v0.24.0
        with:
          file: target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0-fat.jar
          format: cyclonedx-json
          output-file: Figaro.cdx.json
          artifact-name: figaro-cyclonedx-sbom
          upload-release-assets: false

      - name: Upload JVM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: figaro-java17-scala3-sbt2
          path: |
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0.jar
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0-fat.jar
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0-sources.jar
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0-javadoc.jar
            target/out/jvm/scala-3.9.0/figaro/figaro_3-6.1.0.pom
            target/release61-bundle/figaro-6.1.0-maven.zip
            target/release61-bundle/figaro-6.1.0-maven.zip.sha256
          if-no-files-found: error
